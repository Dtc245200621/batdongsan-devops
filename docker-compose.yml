# Hardening: mọi container không được leo quyền thêm
x-security: &security
  security_opt:
    - no-new-privileges:true

services:
  db:
    <<: *security
    image: mysql:8.0
    container_name: bds_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  app:
    <<: *security
    build: ./app
    container_name: bds_app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    networks:
      - frontend
      - backend

  phpmyadmin:
    <<: *security
    image: phpmyadmin:5
    container_name: bds_pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
    depends_on:
      - db
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - admin
      - backend

  nginx:
    <<: *security
    image: nginx:1.27-alpine
    container_name: bds_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - frontend
      - monitoring

  # ---------- Monitoring ----------
  prometheus:
    <<: *security
    image: prom/prometheus:v2.54.1
    container_name: bds_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - monitoring

  grafana:
    <<: *security
    image: grafana/grafana:11.2.0
    container_name: bds_grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - monitoring
      - logging

  cadvisor:
    <<: *security
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: bds_cadvisor
    restart: unless-stopped
    command:
      - "--docker_only=true"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring

  nginx-exporter:
    <<: *security
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: bds_nginx_exporter
    restart: unless-stopped
    command:
      - "-nginx.scrape-uri=http://nginx:8081/stub_status"
    depends_on:
      - nginx
    networks:
      - monitoring

  mysqld-exporter:
    <<: *security
    image: prom/mysqld-exporter:v0.15.1
    container_name: bds_mysqld_exporter
    restart: unless-stopped
    command:
      - "--config.my-cnf=/etc/mysqld-exporter/.my.cnf"
    volumes:
      - ./mysqld-exporter/.my.cnf:/etc/mysqld-exporter/.my.cnf:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - monitoring
      - backend

  # ---------- Logging ----------
  loki:
    <<: *security
    image: grafana/loki:3.1.1
    container_name: bds_loki
    restart: unless-stopped
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - logging

  promtail:
    <<: *security
    image: grafana/promtail:3.1.1
    container_name: bds_promtail
    restart: unless-stopped
    command:
      - "-config.file=/etc/promtail/promtail-config.yml"
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_data:/positions
    depends_on:
      - loki
    networks:
      - logging

# Network isolation:
#  frontend   : nginx <-> app
#  backend    : app, db, phpmyadmin, mysqld-exporter (internal: không ra internet)
#  admin      : phpmyadmin (để publish cổng 127.0.0.1:8080)
#  monitoring : prometheus, grafana, exporters, nginx
#  logging    : loki, promtail, grafana
networks:
  frontend:
  backend:
    internal: true
  admin:
  monitoring:
  logging:

volumes:
  db_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_data:
