global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: cadvisor        # metrics của container
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: nginx           # metrics của web server
    static_configs:
      - targets: ['nginx-exporter:9113']

  - job_name: mysql           # metrics của database
    static_configs:
      - targets: ['mysqld-exporter:9104']
